<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isabella Chat 💬</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --papa:#4f46e5; --papa-light:#eef2ff;
  --isa:#ec4899;  --isa-light:#fdf2f8;
  --bg:#f8f7ff; --surface:#ffffff; --border:#e8e4f3;
  --text:#1e1b4b; --muted:#6b7280;
  --r:20px; --sh:0 4px 24px rgba(79,70,229,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background-image:radial-gradient(circle at 20% 20%,rgba(236,72,153,.08) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(79,70,229,.08) 0%,transparent 50%);}
.screen{display:none;width:100%;max-width:480px;animation:fi .3s ease;}
.screen.active{display:flex;flex-direction:column;}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* LOGIN */
.lcard{background:var(--surface);border-radius:var(--r);padding:40px 32px;box-shadow:var(--sh);text-align:center;}
.logo{font-size:48px;margin-bottom:8px;}
.ltitle{font-size:28px;font-weight:900;color:var(--text);margin-bottom:4px;}
.lsub{color:var(--muted);font-size:14px;margin-bottom:32px;}
.usel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px;}
.ubtn{border:2.5px solid var(--border);background:var(--surface);border-radius:16px;padding:20px 12px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px;}
.ubtn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);}
.ubtn.sp{border-color:var(--papa);background:var(--papa-light);}
.ubtn.si{border-color:var(--isa);background:var(--isa-light);}
.ubtn .av{font-size:36px;line-height:1;}
.ubtn .un{font-weight:800;font-size:15px;color:var(--text);}
.ubtn .ur{font-size:11px;color:var(--muted);font-weight:600;}
.pinsec{display:none;flex-direction:column;gap:12px;}
.pinsec.v{display:flex;}
.pinlbl{font-weight:700;font-size:14px;color:var(--text);text-align:left;}
.pdots{display:flex;justify-content:center;gap:12px;margin:8px 0;}
.pdot{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--border);background:transparent;transition:all .15s;}
.pdot.fp{background:var(--papa);border-color:var(--papa);}
.pdot.fi{background:var(--isa);border-color:var(--isa);}
.pkbd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pkey{border:none;background:#f3f4f6;border-radius:12px;font-family:'Nunito',sans-serif;font-size:20px;font-weight:700;color:var(--text);padding:14px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.pkey:hover{background:#e5e7eb;}
.pkey:active{transform:scale(.94);}
.pkey.del{font-size:16px;}
.pkey.emp{background:transparent;cursor:default;}
.btnlog{border:none;border-radius:14px;padding:14px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;color:white;cursor:pointer;transition:all .2s;margin-top:4px;}
.btnlog.p{background:linear-gradient(135deg,#6366f1,#4f46e5);}
.btnlog.i{background:linear-gradient(135deg,#f472b6,#ec4899);}
.btnlog:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.15);}
.lerr{color:#ef4444;font-size:13px;font-weight:700;text-align:center;min-height:18px;}

/* HEADER */
.ahdr{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.husr{display:flex;align-items:center;gap:12px;}
.hav{font-size:26px;width:42px;height:42px;background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--border);}
.hnm{font-weight:800;font-size:15px;color:var(--text);}
.hst{font-size:12px;color:var(--muted);font-weight:600;}
.btnout{background:none;border:1.5px solid var(--border);border-radius:10px;padding:6px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
.btnout:hover{background:#f3f4f6;color:var(--text);}

/* CONTACTS */
#screen-contacts{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;height:min(700px,100dvh);}
.ctlist{flex:1;overflow-y:auto;}
.cttl{padding:14px 22px 6px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.ctitem{display:flex;align-items:center;gap:14px;padding:13px 22px;cursor:pointer;transition:background .15s;border-bottom:1px solid #f3f4f6;}
.ctitem:hover{background:var(--bg);}
.ctav{font-size:30px;width:50px;height:50px;background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--border);flex-shrink:0;}
.ctnm{font-weight:800;font-size:15px;color:var(--text);}
.ctprev{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.cttm{font-size:11px;color:var(--muted);font-weight:700;flex-shrink:0;}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;padding:11px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--muted);background:none;border:none;cursor:pointer;}
.tab.active{color:var(--papa);border-bottom:2.5px solid var(--papa);}
.tbc{display:none;}
.tbc.active{display:block;}

/* ADMIN */
.aform{padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
.atl{font-weight:900;font-size:15px;color:var(--text);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.fi{border:2px solid var(--border);border-radius:10px;padding:9px 12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;color:var(--text);outline:none;}
.fi:focus{border-color:var(--papa);}
.btnadd{border:none;border-radius:12px;padding:11px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:white;background:linear-gradient(135deg,#6366f1,#4f46e5);cursor:pointer;}
.utbl{width:100%;border-collapse:collapse;font-size:12px;}
.utbl th{padding:8px 14px;text-align:left;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;background:var(--bg);}
.utbl td{padding:10px 14px;border-top:1px solid var(--border);font-weight:600;color:var(--text);}
.btndel{background:none;border:1.5px solid #fee2e2;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;color:#ef4444;cursor:pointer;}
.btndel:hover{background:#fee2e2;}
.rbadge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:800;}
.rbadge.admin{background:var(--papa-light);color:var(--papa);}
.rbadge.user{background:var(--isa-light);color:var(--isa);}

/* CHAT */
#screen-chat{display:none;flex-direction:column;height:100dvh;max-width:480px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
#screen-chat.active{display:flex;}
.chdr{background:var(--surface);padding:13px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.btnbk{background:none;border:none;font-size:22px;cursor:pointer;padding:4px;-webkit-tap-highlight-color:transparent;}
.chinfo{flex:1;}
.chnm{font-weight:800;font-size:15px;color:var(--text);}
.chst{font-size:11px;color:#22c55e;font-weight:700;}
.msgcont{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:3px;background:var(--bg);background-image:radial-gradient(circle at 10% 10%,rgba(236,72,153,.04) 0%,transparent 40%),radial-gradient(circle at 90% 90%,rgba(79,70,229,.04) 0%,transparent 40%);}
.datesep{text-align:center;font-size:11px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.8);padding:3px 12px;border-radius:20px;align-self:center;margin:6px 0;}
.mrow{display:flex;flex-direction:column;max-width:78%;animation:mi .2s ease;}
@keyframes mi{from{opacity:0;transform:scale(.95) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.mrow.mine{align-self:flex-end;align-items:flex-end;}
.mrow.theirs{align-self:flex-start;align-items:flex-start;}
.bub{padding:9px 13px;border-radius:17px;font-size:14px;font-weight:600;line-height:1.45;word-break:break-word;max-width:100%;}
.mrow.mine .bub{background:var(--papa);color:white;border-bottom-right-radius:4px;}
.mrow.mine.ci .bub{background:var(--isa);}
.mrow.theirs .bub{background:white;color:var(--text);border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.bub img{max-width:200px;border-radius:10px;display:block;cursor:pointer;margin-top:4px;}
.bub.stk{background:transparent!important;box-shadow:none!important;padding:2px;}
.bub.stk span{font-size:52px;line-height:1;}
.mtm{font-size:10px;color:var(--muted);font-weight:700;padding:0 3px;margin-top:2px;}
.msnd{font-size:11px;color:var(--muted);font-weight:800;padding:0 3px;margin-bottom:2px;}

/* INPUT */
.cia{padding:9px 12px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px;flex-shrink:0;}
.irow{display:flex;align-items:flex-end;gap:7px;}
.bnico{background:none;border:none;font-size:20px;cursor:pointer;padding:4px;transition:transform .15s;-webkit-tap-highlight-color:transparent;flex-shrink:0;}
.bnico:hover{transform:scale(1.15);}
.minp{flex:1;border:2px solid var(--border);border-radius:20px;padding:9px 13px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;color:var(--text);background:var(--bg);resize:none;max-height:100px;outline:none;transition:border-color .15s;line-height:1.4;}
.minp:focus{border-color:var(--papa);}
.minp.isa:focus{border-color:var(--isa);}
.btnsnd{width:42px;height:42px;border:none;border-radius:50%;background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.btnsnd.isa{background:linear-gradient(135deg,#f472b6,#ec4899);}
.btnsnd:hover{transform:scale(1.08);}

/* PICKER */
.pkpanel{display:none;background:white;border-radius:14px;border:1.5px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.12);overflow:hidden;}
.pkpanel.open{display:block;}
.pktabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;}
.pktab{background:none;border:none;padding:7px 11px;font-size:18px;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;flex-shrink:0;}
.pktab.active{border-bottom-color:var(--papa);}
.pkgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:7px;max-height:150px;overflow-y:auto;}
.pkeit{background:none;border:none;font-size:21px;padding:4px;cursor:pointer;border-radius:7px;transition:background .1s;}
.pkeit:hover{background:var(--bg);}
.stkgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:9px;max-height:150px;overflow-y:auto;}
.stkitem{background:none;border:none;font-size:34px;padding:4px;cursor:pointer;border-radius:9px;transition:all .15s;}
.stkitem:hover{background:var(--bg);transform:scale(1.12);}

/* IMG PREVIEW */
.ipwrap{display:none;position:relative;}
.ipwrap.v{display:block;}
.ipimg{max-height:70px;border-radius:9px;}
.iprm{position:absolute;top:-6px;right:-6px;background:#ef4444;color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;}

/* MODAL */
.imodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;}
.imodal.open{display:flex;}
.imodal img{max-width:90vw;max-height:90vh;border-radius:12px;}
.imc{position:absolute;top:20px;right:20px;background:white;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;}

/* EMPTY */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);padding:40px;text-align:center;}
.empty .em{font-size:48px;}
.empty p{font-weight:700;font-size:14px;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e1b4b;color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:500px){
  body{padding:0;align-items:stretch;}
  .screen{max-width:100%;height:100dvh;}
  .lcard{border-radius:0;height:100%;display:flex;flex-direction:column;justify-content:center;}
  #screen-contacts,#screen-chat,.ahdr{border-radius:0;}
}
</style>

</div>

<!-- CHAT -->

      <div class="pktabs" id="pktabs">
        <button class="pktab active" onclick="switchPK('emoji')">😊</button>

    </div>
  </div>
</div>

<!-- Modal imagen -->
<div class="imodal" id="imodal" onclick="closeModal()">

</div>

  '⚽':['⚽','🏀','🏈','⚾','🎾','🏐','🏉','🎱','🏓','🏸','🎯','🎮','🎲','🎭','🎨','🎪','🎠','🎡','🎢','🏆','🥇','🎖️','🎗️','🎫','🎟️','🎰','🎳','🎸','🎹','🎺'],
};

const STICKERS = ['🥺','🤩','😴','🥶','🥵','🤠','👻','💩','🤡','👽','🎃','🎄','🎅','🤶','🦸','🧙','🧚','🧜','🧝','🧛','💪','👊','✌️','🤞','🤟','🤙','👋','🙌','👏','🤜','🌺','🌸','🌼','🌻','🌹','🍀','🌿','🍁','🍂','🌙','🦊','🐼','🦋','🐬','🦄','🐉','🦁','🐸','🦔','🦩'];

let me=null,chat=null,unsub=null,pin='',selId=null,users=[],pendImg=null,pkOpen=false,sndCtx=null,lastCount=0;

// SOUND
function playNotif(){
  try{
    if(!sndCtx) sndCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=sndCtx.createOscillator(),g=sndCtx.createGain();
    o.connect(g);g.connect(sndCtx.destination);
    o.frequency.setValueAtTime(880,sndCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(440,sndCtx.currentTime+.15);
    g.gain.setValueAtTime(.3,sndCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,sndCtx.currentTime+.3);
    o.start();o.stop(sndCtx.currentTime+.3);
  }catch(e){}
}

// INIT
async function init(){
  for(const u of DEFAULTS){const r=doc(db,'users',u.id);if(!(await getDoc(r)).exists())await setDoc(r,u);}
  await loadUsers();
  renderSel();buildEmojis();buildStickers();
  const sv=sessionStorage.getItem('isa_u');
  if(sv){const u=users.find(x=>x.id===sv);if(u){me=u;showContacts();return;}}
  showScr('login');
}

async function loadUsers(){
  const s=await getDocs(collection(db,'users'));
  users=s.docs.map(d=>({id:d.id,...d.data()}));
}

function showScr(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}
window.showScr=showScr;

// LOGIN
function renderSel(){
  document.getElementById('usel').innerHTML=users.map(u=>`
    <button class="ubtn" id="ub-${u.id}" onclick="selUser('${u.id}')">
      <span class="av">${u.avatar}</span><span class="un">${u.name}</span>
      <span class="ur">${u.role==='admin'?'Admin':'Usuario'}</span>
    </button>`).join('');
}

window.selUser=function(uid){
  selId=uid;pin='';
  const u=users.find(x=>x.id===uid),isI=uid!=='papa';
  document.querySelectorAll('.ubtn').forEach(b=>b.className='ubtn');
  document.getElementById('ub-'+uid).classList.add(isI?'si':'sp');
  document.getElementById('pinlbl').textContent='PIN de '+u.name;
  document.getElementById('btnlog').className='btnlog '+(isI?'i':'p');
  document.getElementById('minp').className='minp '+(isI?'isa':'');
  document.getElementById('btnsnd').className='btnsnd '+(isI?'isa':'');
  updDots();
  document.getElementById('pinsec').classList.add('v');
  document.getElementById('lerr').textContent='';
  if(!sndCtx)try{sndCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
};

window.PK=function(k){if(pin.length>=4)return;pin+=k;updDots();if(pin.length===4)setTimeout(doLogin,200);};
window.PD=function(){pin=pin.slice(0,-1);updDots();};

// Soporte teclado físico para PIN
document.addEventListener('keydown',function(e){
  if(!selId)return;
  const scr=document.getElementById('screen-login');
  if(!scr.classList.contains('active'))return;
  if(e.key>='0'&&e.key<='9'){PK(e.key);}
  else if(e.key==='Backspace'){PD();}
  else if(e.key==='Enter'&&pin.length===4){doLogin();}
});
function updDots(){
  const isI=selId&&selId!=='papa',cls=isI?'fi':'fp';
  document.getElementById('pdots').innerHTML=[0,1,2,3].map(i=>`<div class="pdot ${i<pin.length?cls:''}"></div>`).join('');
}
window.doLogin=async function(){
  if(!selId)return;
  const u=users.find(x=>x.id===selId);
  if(!u)return;
  if(String(pin)!==String(u.pin)){document.getElementById('lerr').textContent='❌ PIN incorrecto';pin='';updDots();return;}
  me=u;sessionStorage.setItem('isa_u',u.id);showContacts();
};
window.doLogout=function(){
  if(unsub){unsub();unsub=null;}
  sessionStorage.removeItem('isa_u');
  me=chat=null;pin='';selId=null;
  document.getElementById('pinsec').classList.remove('v');
  document.querySelectorAll('.ubtn').forEach(b=>b.className='ubtn');
  showScr('login');
};

// CONTACTS
async function showContacts(){
  document.getElementById('hav').textContent=me.avatar;
  document.getElementById('hnm').textContent=me.name;
  document.getElementById('tabsbar').style.display=me.role==='admin'?'flex':'none';
  showScr('contacts');
  await renderContacts();
  if(me.role==='admin')renderUsersTable();
}

async function renderContacts(){
  await loadUsers();
  const others=users.filter(u=>u.id!==me.id);
  const items=await Promise.all(others.map(async u=>{
    const cid=chatId(me.id,u.id);
    const q=query(collection(db,'chats',cid,'messages'),orderBy('ts','desc'),limit(1));
    const s=await getDocs(q);
    let prev='Sin mensajes aún',tm='';
    if(!s.empty){
      const d=s.docs[0].data();
      if(d.type==='image')prev='📷 Imagen';
      else if(d.type==='sticker')prev='🎨 Sticker';
      else prev=(d.text||'').slice(0,35)+((d.text||'').length>35?'…':'');
      tm=d.ts?fmtTime(d.ts.toDate()):'';
    }
    return{u,prev,tm};
  }));
  document.getElementById('ctitems').innerHTML=items.map(({u,prev,tm})=>`
    <div class="ctitem" onclick="openChat('${u.id}')">
      <div class="ctav">${u.avatar}</div>
      <div style="flex:1;min-width:0;"><div class="ctnm">${u.name}</div><div class="ctprev">${esc(prev)}</div></div>
      <div class="cttm">${tm}</div>
    </div>`).join('');
}

window.switchTab=function(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='chats')||(i===1&&t==='admin')));
  document.getElementById('tbc-chats').classList.toggle('active',t==='chats');
  document.getElementById('tbc-admin').classList.toggle('active',t==='admin');
};

// ADMIN
function renderUsersTable(){
  document.getElementById('utbody').innerHTML=users.map(u=>`
    <tr>
      <td>${u.avatar}</td><td>${u.name}</td>
      <td><span class="rbadge ${u.role}">${u.role}</span></td>
      <td>${['papa','isabella'].includes(u.id)?'—':`<button class="btndel" onclick="delUser('${u.id}')">Eliminar</button>`}</td>
    </tr>`).join('');
}
window.addUser=async function(){
  const name=document.getElementById('nn').value.trim();
  const av=document.getElementById('nav').value.trim()||'👤';
  const p=document.getElementById('npin').value.trim();
  const role=document.getElementById('nrol').value;
  if(!name||!p||p.length!==4||isNaN(p)){showToast('⚠️ Nombre y PIN de 4 dígitos requeridos');return;}
  const id=name.toLowerCase().replace(/\s+/g,'_')+'_'+Date.now();
  await setDoc(doc(db,'users',id),{id,name,avatar:av,pin:p,role});
  ['nn','nav','npin'].forEach(x=>document.getElementById(x).value='');
  await loadUsers();renderSel();renderUsersTable();showToast('✅ Usuario agregado');
};
window.delUser=async function(uid){
  if(!confirm('¿Eliminar este usuario?'))return;
  await deleteDoc(doc(db,'users',uid));
  await loadUsers();renderUsersTable();renderContacts();showToast('🗑️ Usuario eliminado');
};

// CHAT
window.openChat=function(uid){
  const other=users.find(u=>u.id===uid);if(!other)return;
  chat=other;
  document.getElementById('chav').textContent=other.avatar;
  document.getElementById('chnm').textContent=other.name;
  closePK();showScr('chat');loadMsgs();
};
window.backToContacts=function(){
  if(unsub){unsub();unsub=null;}
  chat=null;closePK();renderContacts();showScr('contacts');
};

function chatId(a,b){return[a,b].sort().join('_');}

function loadMsgs(){
  if(unsub)unsub();
  const cid=chatId(me.id,chat.id);
  const q=query(collection(db,'chats',cid,'messages'),orderBy('ts','asc'));
  const cont=document.getElementById('msgcont');
  unsub=onSnapshot(q,snap=>{
    if(snap.empty){cont.innerHTML=`<div class="empty"><div class="em">💌</div><p>¡Sé el primero en escribir!</p></div>`;lastCount=0;return;}
    if(snap.docs.length>lastCount&&lastCount>0){
      const last=snap.docs[snap.docs.length-1].data();
      if(last.senderId!==me.id)playNotif();
    }
    lastCount=snap.docs.length;
    const isI=me.id==='isabella';
    let html='',ld='';
    snap.docs.forEach(d=>{
      const m=d.data(),isMine=m.senderId===me.id;
      const ts=m.ts?m.ts.toDate():new Date();
      const ds=fmtDate(ts);
      if(ds!==ld){html+=`<div class="datesep">${ds}</div>`;ld=ds;}
      const rc=isMine?`mrow mine${isI?' ci':''}`:'mrow theirs';
      const snd=!isMine?`<div class="msnd">${m.senderName}</div>`:'';
      let bc='bub',cont2='';
      if(m.type==='image'){bc='bub';cont2=`<img src="${m.imageData}" onclick="openModal('${m.imageData.replace(/'/g,"\\'")}')">`;if(m.text)cont2+=`<div style="margin-top:5px;font-size:13px;">${esc(m.text)}</div>`;}
      else if(m.type==='sticker'){bc='bub stk';cont2=`<span>${m.sticker}</span>`;}
      else{cont2=esc(m.text||'');}
      html+=`<div class="${rc}">${snd}<div class="${bc}">${cont2}</div><div class="mtm">${fmtTime(ts)}</div></div>`;
    });
    cont.innerHTML=html;
    cont.scrollTop=cont.scrollHeight;
  });
}

window.sendMsg=async function(){
  const inp=document.getElementById('minp'),txt=inp.value.trim();
  if(!txt&&!pendImg)return;if(!chat)return;
  closePK();
  const cid=chatId(me.id,chat.id);
  const base={senderId:me.id,senderName:me.name,ts:serverTimestamp()};
  if(pendImg){await addDoc(collection(db,'chats',cid,'messages'),{...base,type:'image',imageData:pendImg,text:txt});rmImg();}
  else{await addDoc(collection(db,'chats',cid,'messages'),{...base,type:'text',text:txt});}
  inp.value='';autoR(inp);
};

async function sendSticker(s){
  if(!chat)return;closePK();
  const cid=chatId(me.id,chat.id);
  await addDoc(collection(db,'chats',cid,'messages'),{senderId:me.id,senderName:me.name,ts:serverTimestamp(),type:'sticker',sticker:s});
}

window.handleKey=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}};
window.autoR=function(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';};

// IMAGE
window.handleImg=function(e){
  const f=e.target.files[0];if(!f)return;
  if(f.size>700000){showToast('⚠️ Imagen muy grande (máx ~600KB)');return;}
  const r=new FileReader();
  r.onload=ev=>{pendImg=ev.target.result;document.getElementById('ipimg').src=pendImg;document.getElementById('ipwrap').classList.add('v');};
  r.readAsDataURL(f);e.target.value='';
};
window.rmImg=function(){pendImg=null;document.getElementById('ipwrap').classList.remove('v');document.getElementById('ipimg').src='';};
window.openModal=function(src){document.getElementById('imodalimg').src=src;document.getElementById('imodal').classList.add('open');};
window.closeModal=function(){document.getElementById('imodal').classList.remove('open');};

// PICKER
function buildEmojis(){
  const grid=document.getElementById('emgrid');
  const cats=Object.keys(EMOJIS);
  const tabs=document.getElementById('pktabs');
  // Remove existing cat tabs (keep first 2: emoji/sticker)
  [...tabs.children].slice(2).forEach(t=>t.remove());
  cats.forEach((cat,i)=>{
    const btn=document.createElement('button');
    btn.className='pktab'+(i===0?' active':'');
    btn.textContent=cat;
    btn.onclick=()=>{
      document.querySelectorAll('.pktab').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
      grid.innerHTML=EMOJIS[cat].map(e=>`<button class="pkeit" onclick="insEmoji('${e}')">${e}</button>`).join('');
    };
    tabs.appendChild(btn);
  });
  // First tab active in emoji picker
  grid.innerHTML=EMOJIS[cats[0]].map(e=>`<button class="pkeit" onclick="insEmoji('${e}')">${e}</button>`).join('');
}
function buildStickers(){
  document.getElementById('stkgrid').innerHTML=STICKERS.map(s=>`<button class="stkitem" onclick="clickStk('${s}')">${s}</button>`).join('');
}
window.insEmoji=function(e){const inp=document.getElementById('minp'),p=inp.selectionStart;inp.value=inp.value.slice(0,p)+e+inp.value.slice(p);inp.focus();inp.selectionStart=inp.selectionEnd=p+e.length;};
window.clickStk=function(s){sendSticker(s);};
window.togglePK=function(){pkOpen=!pkOpen;document.getElementById('pkpanel').classList.toggle('open',pkOpen);};
function closePK(){pkOpen=false;document.getElementById('pkpanel').classList.remove('open');}
window.switchPK=function(t){
  document.getElementById('pk-emoji').style.display=t==='emoji'?'block':'none';
  document.getElementById('pk-sticker').style.display=t==='sticker'?'block':'none';
  document.querySelectorAll('.pktab').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='emoji')||(i===1&&t==='sticker')));
};

// UTILS
function fmtTime(d){return d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(d){
  const t=new Date(),y=new Date(t);y.setDate(t.getDate()-1);
  if(sd(d,t))return'Hoy';if(sd(d,y))return'Ayer';
  return d.toLocaleDateString('es-CL',{day:'numeric',month:'long'});
}
function sd(a,b){return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear();}
function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
window.showToast=function(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);};

init();
</script>
</body>
